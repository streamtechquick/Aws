name: "Adrian's 24/7 Ubuntu Server — Made by Adrian"

on:
  schedule:
    - cron: "*/5 * * * *"   # Re-trigger every 5 minutes — keeps 24/7 alive
  workflow_dispatch:         # Manual trigger anytime

jobs:
  adrian-server:
    runs-on: ubuntu-24.04-64core   # Max RAM: 64GB — largest GitHub-hosted runner
    timeout-minutes: 360            # 6 hours per session (GitHub hard limit)

    steps:

      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. SYSTEM INFO — verify 64GB is live
      # ─────────────────────────────────────────
      - name: System Info
        run: |
          echo "============================================"
          echo "       Adrian's Ubuntu Server — Live        "
          echo "         Made by Adrian  |  GrimVPS         "
          echo "============================================"
          echo ""
          echo "[RAM]"
          free -h
          echo ""
          echo "[CPU]"
          nproc
          lscpu | grep -E "Model name|CPU\(s\)|Thread"
          echo ""
          echo "[DISK]"
          df -h /
          echo ""
          echo "[OS]"
          uname -a
          lsb_release -a

      # ─────────────────────────────────────────
      # 3. RESTORE PREVIOUS SESSION FILES
      # ─────────────────────────────────────────
      - name: Restore Previous Files
        run: |
          mkdir -p ~/restored
          git config --global user.email "actions@github.com"
          git config --global user.name "Adrian-GrimVPS"
          git clone --depth 1 --single-branch --branch backup \
            https://github.com/${{ github.repository }} ~/restore_tmp 2>/dev/null \
            && cp -r ~/restore_tmp/data/. ~/ \
            && echo "[+] Session restored from backup branch" \
            || echo "[!] No previous backup found — fresh session"

      # ─────────────────────────────────────────
      # 4. UBUNTU SERVER ENVIRONMENT SETUP
      # ─────────────────────────────────────────
      - name: Setup Ubuntu Server Environment
        run: |
          echo "[*] Updating apt..."
          sudo apt-get update -qq

          echo "[*] Installing server essentials..."
          sudo apt-get install -y -qq \
            curl wget git unzip zip \
            htop neofetch tmux screen \
            net-tools nmap \
            python3 python3-pip python3-venv \
            nodejs npm \
            build-essential gcc g++ make cmake \
            vim nano \
            jq tree \
            openssh-client \
            ca-certificates gnupg lsb-release

          echo "[*] Python packages..."
          pip3 install --quiet requests aiohttp flask fastapi uvicorn

          echo "[*] Node packages..."
          npm install -g pm2 nodemon 2>/dev/null || true

          echo ""
          echo "============================================"
          echo "   [+] Ubuntu Server Ready — Made by Adrian "
          echo "============================================"
          neofetch || true

      # ─────────────────────────────────────────
      # 5. TMATE SSH SESSION — Made by Adrian
      # ─────────────────────────────────────────
      - name: "tmate SSH Session — Made by Adrian | GrimVPS"
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false   # Anyone with link can join (set true to lock to you)
        env:
          TMATE_SESSION_NAME: "Adrian-GrimVPS-Server"
        # tmate will print SSH + web link in logs
        # Session stays alive until timeout-minutes hits (6h)

      # ─────────────────────────────────────────
      # 6. SAVE SESSION FILES BACK TO REPO
      # ─────────────────────────────────────────
      - name: Save Session to Backup Branch
        if: always()
        run: |
          mkdir -p /tmp/session_save/data
          # Save home directory (skip huge folders)
          rsync -a --exclude='.cache' --exclude='node_modules' \
            --exclude='.npm' --exclude='restore_tmp' \
            ~/ /tmp/session_save/data/ 2>/dev/null || true

          cd /tmp/session_save
          git init
          git config user.email "actions@github.com"
          git config user.name "Adrian-GrimVPS"
          git remote add origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git checkout -b backup
          git add .
          git commit -m "Auto backup — $(date '+%Y-%m-%d %H:%M:%S') — Made by Adrian" \
            || echo "[!] Nothing new to commit"
          git push -f origin backup \
            && echo "[+] Backup pushed to backup branch" \
            || echo "[!] Push failed"

      # ─────────────────────────────────────────
      # 7. SELF-TRIGGER — 24/7 LOOP
      #    Triggers next run before this one dies
      # ─────────────────────────────────────────
      - name: Self-Trigger Next Session (24/7 Loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Triggering next session — 24/7 loop active..."
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/aws.yml/dispatches \
            -d '{"ref":"main"}' \
            && echo "[+] Next session triggered — Adrian's server never sleeps 💀" \
            || echo "[!] Self-trigger failed — cron will catch it in 5 min"
